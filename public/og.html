<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card source</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #ede8df;
        --fg-muted: #a1a9b3;
        --fg-faint: #7c8692;
        --line: rgba(237, 232, 223, 0.08);
        --accent: #8b7cff;
        --accent-grad: linear-gradient(135deg, #9d8cff 0%, #4f46e5 100%);
        --accent-glow: rgba(124, 108, 255, 0.32);
        --accent-soft: rgba(139, 124, 255, 0.14);
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 88px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }
      .glow {
        position: absolute;
        top: -55%;
        left: 50%;
        width: 1300px;
        height: 800px;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 60%);
        filter: blur(20px);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, var(--line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--line) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
      }
      .status {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        padding: 9px 16px 9px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(16, 22, 29, 0.7);
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        color: var(--fg-muted);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }
      h1 {
        position: relative;
        margin: 10px 0 0;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }
      .role {
        position: relative;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.015em;
      }
      .role span {
        background: var(--accent-grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sep {
        color: var(--fg-faint);
        margin: 0 14px;
      }
      .url {
        position: absolute;
        left: 88px;
        bottom: 56px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        color: var(--fg-faint);
      }
      .mark {
        position: absolute;
        right: 88px;
        bottom: 56px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--accent-grad);
        box-shadow: 0 0 0 8px var(--accent-soft);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="grid"></div>
      <p class="status">
        <span class="dot"></span>Lead contributor on a Tauri + React + Rust cloud-ops desktop app
      </p>
      <h1>Avinash Sahu</h1>
      <p class="role">
        Software Developer<span class="sep">·</span><span>React, TypeScript, Rust, Cloud</span>
      </p>
      <p class="url">avinash9694.github.io</p>
      <div class="mark"></div>
    </div>
  </body>
</html>
